name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    env:
      # Prisma validate/generate only need a syntactically valid DATABASE_URL.
      # No real database is required for these steps.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pearl_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Reads the `packageManager` field from the root package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        working-directory: packages/database
        run: pnpm exec prisma validate

      - name: Prisma generate
        working-directory: packages/database
        run: pnpm exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @pearl/api exec tsc --noEmit

      - name: Typecheck Web
        run: pnpm --filter @pearl/web exec tsc --noEmit

      - name: Build API
        run: pnpm --filter @pearl/api build

      - name: Build Web
        run: pnpm --filter @pearl/web build
