version: '3.8'
services:
  db:
    image: postgres:15
    container_name: pearl-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pearl_local
    ports:
      - "5432:5432"
    volumes:
      - pearl_pgdata:/var/lib/postgresql/data

volumes:
  pearl_pgdata:
