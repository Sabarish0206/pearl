version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pearl_local}
    ports:
      - "5432:5432"
    volumes:
      - pearl_pgdata:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "80:3000"
    networks:
      - backend

networks:
  backend:

volumes:
  pearl_pgdata:
